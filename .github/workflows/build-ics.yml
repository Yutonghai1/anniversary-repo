name: Build Anniversary ICS

on:
  schedule:
    - cron: '0 17 * * *'   # UTC 22:00 = 北京时间次日 06:00
  workflow_dispatch:        # 允许手动触发

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Generate ICS
        run: python generate_ics.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment
  keepalive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check days since last commit
        id: check
        run: |
          LAST_COMMIT=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          DAYS=$(( (NOW - LAST_COMMIT) / 86400 ))
          echo "days=$DAYS" >> $GITHUB_OUTPUT
          echo "距离上次提交已过 $DAYS 天"

      - name: Keep alive commit
        if: steps.check.outputs.days >= 50
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "keepalive $(date -u)" > .github/keepalive.txt
          git add .github/keepalive.txt
          git commit -m "chore: keepalive (reset 60-day timer)"
          git push
